spring.application.name=bot-service
server.port=8087
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

spring.ai.mcp.client.name=bank-assistant
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8085
spring.ai.mcp.client.streamable-http.connections.transaction.url=http://localhost:8086

discord.token=${DISCORD_API_KEY}
discord.enabled=true
