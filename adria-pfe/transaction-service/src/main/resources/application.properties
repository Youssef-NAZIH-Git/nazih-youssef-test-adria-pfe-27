spring.application.name=transaction-service
server.port=8086
spring.datasource.url=jdbc:h2:mem:transaction-db
spring.cloud.discovery.enabled=true
spring.h2.console.enabled=true
spring.cloud.config.enabled=false

# Protect Feign account lookups with Resilience4J.
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.account-service.connectTimeout=2000
spring.cloud.openfeign.client.config.account-service.readTimeout=2000
# Feign's HTTP timeouts handle slow calls instead of a second time limiter.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
